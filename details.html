<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }
        .login-container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .login-container:hover {
            transform: translateY(-5px);
        }
        .login-title {
            background: linear-gradient(to right, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 2rem;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        .input-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }
        .input-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        .input-group input:focus {
            border-color: #4f46e5;
            outline: none;
        }
        .role-options {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }
        .role-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #1f2937;
        }
        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(to right, #4f46e5, #7c3aed);
            color: white;
            font-weight: 600;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(to right, #3b82f6, #9333ea);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>
<body>
    <div class="login-container fade-in">
        <h2 class="login-title text-2xl font-bold">Enter Your Details</h2>
        <form id="details-form" method="GET" action="">
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter Your Name" required />
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter Your Email" required />
            </div>
            <div class="input-group">
                <label for="phone">Alternate Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter Your Phone Number" required />
            </div>
            <div class="input-group">
                <label>Role</label>
                <div class="role-options">
                    <label class="role-option">
                        <input type="radio" name="role" value="seeker" required />
                        Seeker
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="recruiter" required />
                        Recruiter
                    </label>
                </div>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn-primary">Submit</button>
            </div>
        </form>
    </div>
    <script>
        document.getElementById('details-form').addEventListener('submit', function(event) {
            const selectedRole = document.querySelector('input[name="role"]:checked').value;
            if (selectedRole === 'seeker') {
                this.action = 'seeker.html';
            } else if (selectedRole === 'recruiter') {
                this.action = 'recruiter.html';
            }
        });
    </script>
</body>
</html>
