<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <h2>Login with Mobile</h2>
    <div class="input-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="+91 9876543210" />
    </div>
    <div class="input-group" id="otp-group" style="display: none;">
      <label for="otp">Enter OTP</label>
      <input type="text" id="otp" placeholder="Enter OTP here" />
    </div>
    <button id="otp-btn">Send OTP</button>
    <p id="status" class="status-msg"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
